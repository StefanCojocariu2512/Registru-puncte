<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Panou Admin - Modificare Punctaje</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    table { border-collapse: collapse; width: 100%; max-width: 600px; margin-top: 15px; }
    th, td { border: 1px solid #ccc; padding: 8px; text-align: left; }
    th { background-color: #f4f4f4; }
    button { padding: 5px 10px; font-weight: bold; cursor: pointer; }
    .btn-plus { background-color: #4CAF50; color: white; border: none; }
    .btn-minus { background-color: #f44336; color: white; border: none; }
  </style>
</head>
<body>
  <h2>Panou Admin</h2>
  <label for="sheetSelect">Selectează grupa / pagina:</label>
  <select id="sheetSelect" onchange="renderTable()"></select>

  <table id="dataTable">
    <thead>
      <tr>
        <th>Cod Student</th>
        <th>Punctaj Curent</th>
        <th>Acțiuni</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbwh-Mx-1FFEjT5NSssTsKu57BATRdF5fz9DBsdwOT2-v-oxjYhPdi0Rm07wg5WRRQk6Dg/exec";
    const ADMIN_SECRET = "admin123";
    let allData = {};

    async function loadData() {
      const response = await fetch(API_URL);
      allData = await response.json();
      
      const select = document.getElementById("sheetSelect");
      const currentVal = select.value;
      select.innerHTML = "";
      
      Object.keys(allData).forEach(sheetName => {
        const opt = document.createElement("option");
        opt.value = sheetName;
        opt.innerText = sheetName;
        select.appendChild(opt);
      });

      if (currentVal) select.value = currentVal;
      renderTable();
    }

    function renderTable() {
      const selectedSheet = document.getElementById("sheetSelect").value;
      const tbody = document.querySelector("#dataTable tbody");
      tbody.innerHTML = "";

      if (allData[selectedSheet]) {
        allData[selectedSheet].forEach(item => {
          const tr = document.createElement("tr");
          tr.innerHTML = `
            <td>${item.cod}</td>
            <td id="score-${selectedSheet}-${item.row}">${item.punctaj}</td>
            <td>
              <button class="btn-plus" onclick="updateScore('${selectedSheet}', ${item.row}, 'plus')">+</button>
              <button class="btn-minus" onclick="updateScore('${selectedSheet}', ${item.row}, 'minus')">-</button>
            </td>
          `;
          tbody.appendChild(tr);
        });
      }
    }

    async function updateScore(sheetName, rowIndex, action) {
      const payload = {
        secret: ADMIN_SECRET,
        sheetName: sheetName,
        rowIndex: rowIndex,
        action: action
      };

      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const res = await response.json();
      if (res.status === "success") {
        document.getElementById(`score-${sheetName}-${rowIndex}`).innerText = res.newScore;
      } else {
        alert("Eroare: " + res.message);
      }
    }

    loadData();
  </script>
</body>
</html>
