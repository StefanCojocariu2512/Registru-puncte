<!DOCTYPE html>
<html lang="ro">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Punctaj - admin</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <div id="panou-login" class="login">
    <h2>Admin</h2>
    <input type="password" id="admin-pass" placeholder="Introdu parola">
    <button onclick="authenticateAdmin()">Log in</button>
  </div>

  <div id="admin-content" class="panou hidden">
    <div class="panou-selector">
      <label for="class-panou-selector">Clasa</label>
      <select id="class-panou-selector" onchange="renderTable()"></select>

      <div class="buttons-container">
        <button class="buton-actiune" onclick="updateScore('plus')">+</button>
        <button class="buton-actiune" onclick="updateScore('minus')">-</button>
      </div>

      <div class="buttons-container">
        <button class="buton-actiune" onclick="updateScore('+1')">+1</button>
        <button class="buton-actiune" onclick="updateScore('10')">10</button>
      </div>
    </div>

    <div class="panou-tablou">
      <table id="data">
        <tbody>
          
        </tbody>
      </table>
    </div>
  </div>

  <script src="scripts.js"></script>
</body>

</html>
